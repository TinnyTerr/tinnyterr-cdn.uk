<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation Site</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">
    <header class="bg-white shadow p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">DocuSite</h1>
            <nav>
                <ul class="flex space-x-4">
                    <li><a href="#home" class="text-gray-700 hover:text-blue-600">Home</a></li>
                    <li><a href="#docs" class="text-gray-700 hover:text-blue-600">Docs</a></li>
                    <li><a href="#login" class="text-gray-700 hover:text-blue-600">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container mx-auto py-6">
        <!-- Documentation Section -->
        <section id="home" class="my-10">
            <h2 class="text-xl font-semibold mb-4">Welcome to DocuSite</h2>
            <p class="text-gray-700">A place to find and explore all the documentation you need.</p>
        </section>

        <!-- Documentation Content -->
        <section id="docs" class="my-10">
            <h2 class="text-xl font-semibold mb-4">Documentation</h2>
            <p class="text-gray-700">Browse our detailed guides and technical references here.</p>
        </section>

        <!-- Login Section -->
        <section id="login" class="my-10">
            <h2 class="text-xl font-semibold mb-4">Login</h2>
            <form class="bg-white p-6 rounded-lg shadow-lg">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" name="email"
                        class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password"
                        class="mt-1 p-2 w-full border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700">Login</button>
            </form>
        </section>
    </main>

    <footer class="bg-gray-800 text-white py-4">
        <div class="container mx-auto text-center">
            <p>&copy; 2025 DocuSite. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
